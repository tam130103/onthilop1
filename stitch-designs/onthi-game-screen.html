<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn chơi tương tác Lớp 1 - onthi.app & Duolingo style</title>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            duoGreen: '#58CC02',
            duoGreenDark: '#45A300',
            duoGreenLight: '#d7ffb8',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      user-select: none;
    }
    /* Chunky 3D Press effect */
    .btn-3d {
      transition: all 0.08s ease-in-out;
    }
    .btn-3d:active {
      transform: translateY(3px);
    }
    /* Confetti float animation */
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-gentle {
      animation: bounce-gentle 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FAF8F5] text-slate-800 antialiased min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-green-100">

  <!-- ==================== 1. TOP HEADER (Duolingo / onthi.app style) ==================== -->
  <header class="w-full max-w-4xl mx-auto px-4 pt-5 pb-3 flex items-center justify-between gap-4">
    <!-- Nút Đóng [X] -->
    <button class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 active:scale-95 transition-all text-xl font-black">
      ✕
    </button>

    <!-- Thanh tiến trình (Progress Bar) -->
    <div class="flex-1 max-w-lg h-4 bg-slate-200 rounded-full p-[2px] shadow-inner relative overflow-hidden">
      <!-- Vạch tiến độ xanh rực rỡ với vệt sáng phía trên -->
      <div class="h-full bg-[#58CC02] rounded-full w-[65%] relative transition-all duration-500 shadow-[0_2px_4px_rgba(88,204,2,0.4)]">
        <!-- Vệt sáng phản chiếu (Gloss effect) -->
        <div class="absolute top-[2px] left-2 right-2 h-[3px] bg-white/45 rounded-full"></div>
      </div>
    </div>

    <!-- Huy hiệu năng lượng / XP (Tia sét 20 XP) -->
    <div class="flex items-center gap-1.5 px-3.5 py-1.5 bg-amber-50 border-2 border-b-4 border-amber-200 border-b-amber-400 rounded-2xl shadow-sm text-amber-600 font-extrabold text-sm tracking-tight active:translate-y-[1px]">
      <span class="text-base text-amber-500 drop-shadow-sm">⚡</span>
      <span>20 XP</span>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
  <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-1 flex flex-col justify-center">

    <!-- 2. KHU VỰC ĐỀ BÀI & GIỌNG ĐỌC CÔ GIÁO -->
    <section class="mb-5 flex flex-col sm:flex-row sm:items-center gap-4">
      <!-- Nút phát âm 3D chunky -->
      <button class="btn-3d self-start sm:self-auto flex items-center gap-2.5 px-5 py-2.5 bg-white border-2 border-b-4 border-sky-300 border-b-sky-500 text-sky-600 hover:bg-sky-50 font-extrabold rounded-2xl shadow-sm active:border-b-2 active:translate-y-[2px]">
        <span class="text-xl">🔊</span>
        <span class="text-base">Nghe cô đọc</span>
      </button>

      <!-- Câu hỏi to rõ ràng -->
      <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight leading-snug">
        Hình nào dưới đây có <span class="text-sky-600 underline decoration-sky-300 decoration-4 underline-offset-4">3 chú gà con</span>?
      </h1>
    </section>

    <!-- 3. KHUNG BÀI TƯƠNG TÁC TRUNG TÂM (STAGE CHÍNH) -->
    <div class="bg-white rounded-3xl p-5 sm:p-7 border-2 border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-2">
      <!-- Lời gợi ý nhỏ dành cho bé lớp 1 -->
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          Bé hãy đếm số lượng gà ở mỗi ô nhé!
        </div>
        <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">Câu 04 / 10</span>
      </div>

      <!-- Lưới 3 Thẻ lựa chọn A, B, C (3D Chunky Cards) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- THẺ A (2 chú gà) - Trạng thái bình thường -->
        <div class="btn-3d group cursor-pointer bg-white border-2 border-b-[5px] border-slate-200 border-b-slate-300 rounded-2xl p-4 flex flex-col items-center justify-between gap-3 text-slate-700 hover:border-violet-300 hover:bg-violet-50/20 active:border-b-2 active:translate-y-[3px] transition-all">
          <div class="w-full flex items-center justify-between">
            <span class="w-8 h-8 rounded-full bg-slate-100 group-hover:bg-violet-100 text-slate-600 group-hover:text-violet-600 font-black text-sm flex items-center justify-center border border-slate-200">
              A
            </span>
            <span class="text-xs font-bold text-slate-400">2 chú gà</span>
          </div>

          <!-- Minh họa vector 2 chú gà con -->
          <div class="h-32 w-full flex items-center justify-center gap-3 bg-amber-50/50 rounded-xl p-2 border border-dashed border-amber-200/80">
            <!-- Gà 1 -->
            <div class="flex flex-col items-center transition-transform group-hover:scale-105">
              <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Thân gà -->
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <ellipse cx="40" cy="62" rx="10" ry="14" fill="#FDE047" stroke="#EAB308" stroke-width="2" transform="rotate(-15 40 62)"/>
                <!-- Đầu gà -->
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <!-- Mắt to ngây thơ -->
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <circle cx="57.5" cy="28.5" r="1.5" fill="white"/>
                <!-- Mỏ cam -->
                <polygon points="68,32 78,35 68,38" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
                <!-- Má hồng -->
                <circle cx="52" cy="38" r="3.5" fill="#FDA4AF"/>
                <!-- Mào đỏ nhỏ -->
                <circle cx="48" cy="14" r="4" fill="#EF4444"/>
                <circle cx="53" cy="13" r="3.5" fill="#EF4444"/>
                <!-- Chân nhỏ -->
                <line x1="42" y1="90" x2="42" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
                <line x1="58" y1="90" x2="58" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Gà 2 -->
            <div class="flex flex-col items-center transition-transform group-hover:scale-105">
              <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <ellipse cx="40" cy="62" rx="10" ry="14" fill="#FDE047" stroke="#EAB308" stroke-width="2" transform="rotate(-15 40 62)"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <circle cx="57.5" cy="28.5" r="1.5" fill="white"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
                <circle cx="52" cy="38" r="3.5" fill="#FDA4AF"/>
                <circle cx="48" cy="14" r="4" fill="#EF4444"/>
                <circle cx="53" cy="13" r="3.5" fill="#EF4444"/>
                <line x1="42" y1="90" x2="42" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
                <line x1="58" y1="90" x2="58" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
          </div>

          <div class="w-full text-center py-1">
            <span class="text-sm font-bold text-slate-500">Hai chú gà</span>
          </div>
        </div>

        <!-- THẺ B (3 chú gà) - TRẠNG THÁI ĐANG ĐƯỢC CHỌN VÀ CHÍNH XÁC (HIGHLIGHT DUOLINGO) -->
        <div class="btn-3d cursor-pointer bg-green-50 border-2 border-b-[5px] border-[#58CC02] border-b-[#45A300] rounded-2xl p-4 flex flex-col items-center justify-between gap-3 text-emerald-800 shadow-sm relative active:border-b-2 active:translate-y-[3px] transition-all ring-2 ring-green-200">
          <!-- Huy hiệu checked nhỏ góc trên -->
          <div class="w-full flex items-center justify-between">
            <span class="w-8 h-8 rounded-full bg-[#58CC02] text-white font-black text-sm flex items-center justify-center shadow-sm">
              B
            </span>
            <span class="inline-flex items-center gap-1 text-xs font-black text-emerald-700 bg-emerald-200/70 px-2 py-0.5 rounded-full">
              ✓ Đang chọn
            </span>
          </div>

          <!-- Minh họa vector 3 chú gà con (Đáp án đúng) -->
          <div class="h-32 w-full flex items-center justify-center gap-1.5 bg-white/90 rounded-xl p-2 border border-emerald-300 shadow-inner">
            <!-- Gà con 1 -->
            <div class="transform -rotate-6 scale-90">
              <svg width="55" height="55" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <ellipse cx="40" cy="62" rx="10" ry="14" fill="#FDE047" stroke="#EAB308" stroke-width="2" transform="rotate(-15 40 62)"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <circle cx="57.5" cy="28.5" r="1.5" fill="white"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
                <circle cx="52" cy="38" r="3.5" fill="#FDA4AF"/>
                <circle cx="48" cy="14" r="4" fill="#EF4444"/>
                <circle cx="53" cy="13" r="3.5" fill="#EF4444"/>
                <line x1="42" y1="90" x2="42" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
                <line x1="58" y1="90" x2="58" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Gà con 2 (ở giữa nhô cao) -->
            <div class="transform scale-100 z-10">
              <svg width="58" height="58" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <ellipse cx="40" cy="62" rx="10" ry="14" fill="#FDE047" stroke="#EAB308" stroke-width="2" transform="rotate(-15 40 62)"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <circle cx="57.5" cy="28.5" r="1.5" fill="white"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
                <circle cx="52" cy="38" r="3.5" fill="#FDA4AF"/>
                <circle cx="48" cy="14" r="4" fill="#EF4444"/>
                <circle cx="53" cy="13" r="3.5" fill="#EF4444"/>
                <line x1="42" y1="90" x2="42" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
                <line x1="58" y1="90" x2="58" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Gà con 3 -->
            <div class="transform rotate-6 scale-90">
              <svg width="55" height="55" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <ellipse cx="40" cy="62" rx="10" ry="14" fill="#FDE047" stroke="#EAB308" stroke-width="2" transform="rotate(-15 40 62)"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <circle cx="57.5" cy="28.5" r="1.5" fill="white"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
                <circle cx="52" cy="38" r="3.5" fill="#FDA4AF"/>
                <circle cx="48" cy="14" r="4" fill="#EF4444"/>
                <circle cx="53" cy="13" r="3.5" fill="#EF4444"/>
                <line x1="42" y1="90" x2="42" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
                <line x1="58" y1="90" x2="58" y2="97" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
          </div>

          <div class="w-full text-center py-1">
            <span class="text-sm font-black text-emerald-800">Ba chú gà con</span>
          </div>
        </div>

        <!-- THẺ C (4 chú gà) - Trạng thái bình thường -->
        <div class="btn-3d group cursor-pointer bg-white border-2 border-b-[5px] border-slate-200 border-b-slate-300 rounded-2xl p-4 flex flex-col items-center justify-between gap-3 text-slate-700 hover:border-violet-300 hover:bg-violet-50/20 active:border-b-2 active:translate-y-[3px] transition-all">
          <div class="w-full flex items-center justify-between">
            <span class="w-8 h-8 rounded-full bg-slate-100 group-hover:bg-violet-100 text-slate-600 group-hover:text-violet-600 font-black text-sm flex items-center justify-center border border-slate-200">
              C
            </span>
            <span class="text-xs font-bold text-slate-400">4 chú gà</span>
          </div>

          <!-- Minh họa vector 4 chú gà con bố trí 2x2 gọn gàng -->
          <div class="h-32 w-full grid grid-cols-2 grid-rows-2 items-center justify-items-center bg-amber-50/50 rounded-xl p-1 border border-dashed border-amber-200/80">
            <div class="scale-75 -m-2">
              <svg width="50" height="50" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316"/>
              </svg>
            </div>
            <div class="scale-75 -m-2">
              <svg width="50" height="50" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316"/>
              </svg>
            </div>
            <div class="scale-75 -m-2">
              <svg width="50" height="50" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316"/>
              </svg>
            </div>
            <div class="scale-75 -m-2">
              <svg width="50" height="50" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="58" r="32" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="50" cy="34" r="22" fill="#FACC15" stroke="#CA8A04" stroke-width="4"/>
                <circle cx="56" cy="30" r="4.5" fill="#1E293B"/>
                <polygon points="68,32 78,35 68,38" fill="#F97316"/>
              </svg>
            </div>
          </div>

          <div class="w-full text-center py-1">
            <span class="text-sm font-bold text-slate-500">Bốn chú gà</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ==================== 4. KHAY DƯỚI ĐÁY: THÔNG BÁO KẾT QUẢ & ACTION DOCK ==================== -->
  <footer class="w-full bg-[#d7ffb8] border-t-2 border-[#b8f28b] px-4 py-4 sm:py-5 shadow-lg relative">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">

      <!-- Thông báo kết quả phong cách Duolingo / onthi.app -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl shadow-sm border border-emerald-300 animate-gentle shrink-0">
          🥳
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span class="text-lg sm:text-xl font-black text-[#45A300]">Chính xác! Tuyệt vời lắm bé ơi!</span>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-black bg-amber-400 text-amber-900 shadow-sm">
              +10 XP
            </span>
          </div>
          <span class="text-xs sm:text-sm font-medium text-emerald-800">Bé đã chọn đúng hình có 3 chú gà con!</span>
        </div>
      </div>

      <!-- Khối các nút hành động (Back, Nháp, Tiếp Tục) -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <!-- Nút quay lại góc trái (hình vuông bo góc dập nổi 3D) -->
        <button title="Quay lại câu trước" class="btn-3d w-14 h-14 shrink-0 rounded-2xl border-2 border-b-4 border-slate-200 border-b-slate-300 bg-white text-slate-500 hover:text-slate-700 hover:bg-slate-50 flex items-center justify-center font-black text-xl shadow-sm active:border-b-2 active:translate-y-[2px]">
          ◀
        </button>

        <!-- Nút mở giấy nháp (tím nhạt) -->
        <button class="btn-3d hidden md:flex items-center gap-2 px-4 h-14 rounded-2xl border-2 border-b-4 border-violet-200 border-b-violet-300 bg-white text-violet-600 hover:bg-violet-50 font-extrabold text-sm shadow-sm active:border-b-2 active:translate-y-[2px]">
          <span class="text-base">✏️</span>
          <span>Mở giấy nháp</span>
        </button>

        <!-- Nút hành động chính: TIẾP TỤC (Xanh Duolingo to bản chunky 3D) -->
        <button class="btn-3d flex-1 sm:flex-initial sm:min-w-[200px] h-14 px-8 bg-[#58CC02] border-b-[5px] border-[#45A300] text-white font-black text-lg sm:text-xl rounded-2xl tracking-wide uppercase shadow-[0_4px_12px_rgba(88,204,2,0.35)] flex items-center justify-center gap-2 active:border-b-[2px] active:translate-y-[3px] hover:brightness-105 transition-all">
          <span>TIẾP TỤC</span>
          <span class="text-2xl font-black leading-none">➔</span>
        </button>
      </div>

    </div>
  </footer>

</body>
</html>
