<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Building body -->
  <rect x="20" y="42" width="60" height="46" rx="2" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="12,42 50,16 88,42" fill="#ef4444"/>
  <!-- Clock on roof -->
  <circle cx="50" cy="32" r="7" fill="#ffffff" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="50" y1="32" x2="50" y2="28" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="53" y2="32" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Door -->
  <rect x="42" y="64" width="16" height="24" rx="2" fill="#b45309"/>
  <!-- Windows -->
  <rect x="26" y="50" width="10" height="10" rx="1" fill="#bae6fd"/>
  <rect x="64" y="50" width="10" height="10" rx="1" fill="#bae6fd"/>
</svg>
