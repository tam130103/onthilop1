<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Body -->
  <ellipse cx="50" cy="70" rx="24" ry="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- Tail -->
  <circle cx="24" cy="72" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="50" cy="46" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Ears -->
  <ellipse cx="42" cy="20" rx="6" ry="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="42" cy="20" rx="3.5" ry="12" fill="#fbcfe8"/>
  <ellipse cx="58" cy="20" rx="6" ry="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="58" cy="20" rx="3.5" ry="12" fill="#fbcfe8"/>
  <!-- Eyes -->
  <circle cx="44" cy="44" r="3" fill="#e11d48"/>
  <circle cx="56" cy="44" r="3" fill="#e11d48"/>
  <!-- Nose & Mouth -->
  <polygon points="48,50 52,50 50,53" fill="#f43f5e"/>
  <path d="M47 54 Q50 57 50 53 Q50 57 53 54" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="38" y1="50" x2="26" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="38" y1="54" x2="26" y2="56" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="62" y1="50" x2="74" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="62" y1="54" x2="74" y2="56" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Paws -->
  <ellipse cx="42" cy="86" rx="6" ry="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="58" cy="86" rx="6" ry="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
