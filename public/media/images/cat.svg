  <ellipse cx="48" cy="68" rx="26" ry="20" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
  <ellipse cx="48" cy="70" rx="16" ry="12" fill="#ffedd5"/>
  <!-- Head -->
  <circle cx="50" cy="40" r="22" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
  <!-- Ears -->
  <polygon points="32,28 38,12 48,22" fill="#fb923c" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="35,26 39,16 46,23" fill="#fecdd3"/>
  <polygon points="68,28 62,12 52,22" fill="#fb923c" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="65,26 61,16 54,23" fill="#fecdd3"/>
  <!-- Eyes -->
  <ellipse cx="42" cy="38" rx="3.5" ry="4.5" fill="#1e293b"/>
