  <path d="M46 48 Q50 52 50 47 Q50 52 54 48" fill="none" stroke="#7c2d12" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="36" y1="44" x2="24" y2="42" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="24" y2="50" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="44" x2="76" y2="42" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="48" x2="76" y2="50" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="40" cy="85" rx="6" ry="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <ellipse cx="56" cy="85" rx="6" ry="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
