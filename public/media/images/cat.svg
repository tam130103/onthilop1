<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Tail -->
  <path d="M22 68 Q10 60 14 42 Q18 42 18 52 Q20 62 26 66" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
