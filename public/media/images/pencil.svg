<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="pencilShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#pencilShadow)" transform="rotate(45 100 100)">
    <!-- Eraser -->
    <rect x="80" y="20" width="40" height="25" rx="6" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
    <!-- Metal Ferrule -->
    <rect x="78" y="45" width="44" height="15" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <line x1="78" y1="52" x2="122" y2="52" stroke="#94a3b8" stroke-width="2"/>
    <!-- Pencil Body (Yellow) -->
    <rect x="80" y="60" width="40" height="85" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <!-- Body Facets -->
    <rect x="93" y="60" width="14" height="85" fill="#fef08a"/>
    <!-- Wood Sharpened Tip -->
    <polygon points="80,145 120,145 100,180" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <!-- Graphite Lead Tip -->
    <polygon points="94,170 106,170 100,180" fill="#1e293b"/>
  </g>
</svg>
