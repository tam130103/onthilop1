<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="fishShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#fishShadow)">
    <!-- Tail Fin -->
    <path d="M50,100 L15,65 Q35,100 15,135 Z" fill="url(#finGrad)" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
    <!-- Top & Bottom Fins -->
    <path d="M100,55 Q115,25 140,50 Z" fill="url(#finGrad)" stroke="#c2410c" stroke-width="2"/>
    <path d="M110,145 Q125,175 135,145 Z" fill="url(#finGrad)" stroke="#c2410c" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="110" cy="100" rx="65" ry="45" fill="url(#fishGrad)" stroke="#075985" stroke-width="4"/>
    <!-- Pectoral Fin -->
    <path d="M95,100 Q120,95 110,120 Q95,115 95,100 Z" fill="url(#finGrad)" stroke="#c2410c" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="145" cy="90" r="12" fill="#ffffff" stroke="#075985" stroke-width="2"/>
    <circle cx="148" cy="90" r="6" fill="#0f172a"/>
    <circle cx="146" cy="88" r="2.5" fill="#ffffff"/>
    <!-- Smile & Gill -->
    <path d="M165,105 Q155,115 145,108" stroke="#075985" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M125,85 Q135,100 125,115" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Bubbles -->
    <circle cx="175" cy="75" r="5" fill="#bae6fd" opacity="0.6"/>
    <circle cx="185" cy="55" r="8" fill="#bae6fd" opacity="0.7"/>
  </g>
</svg>
