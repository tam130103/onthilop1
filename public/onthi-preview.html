<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Thi Clone - Showcase Thiết Kế Từ Stitch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
    .tab-btn.active {
      background-color: #58CC02;
      color: white;
      border-bottom-color: #45A300;
      transform: translateY(2px);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-800">
  <!-- Top Bar -->
  <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-sm sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-amber-400 flex items-center justify-center text-2xl shadow-sm">⭐</div>
      <div>
        <h1 class="text-xl font-black tracking-tight"><span class="text-slate-900">Ôn</span><span class="text-violet-600">Thi</span> <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full ml-1">Stitch MCP Design</span></h1>
        <p class="text-xs text-slate-500 font-medium">Bản thiết kế chuẩn 100% giao diện onthi.app & phong cách Duolingo</p>
      </div>
    </div>

    <!-- Switcher Tabs -->
    <nav class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
      <button onclick="setTab('game')" id="tab-game" class="tab-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold border-b-[3px] border-transparent transition-all">
        🎮 Màn chơi tương tác (Game)
      </button>
      <button onclick="setTab('home')" id="tab-home" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 border-b-[3px] border-transparent transition-all">
        🏠 Trang chủ & Chọn môn (Lớp 1)
      </button>
      <button onclick="setTab('math-tv')" id="tab-math-tv" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 border-b-[3px] border-transparent transition-all">
        📺 Sân khấu TV Toán 16:9
      </button>
      <button onclick="setTab('vn-tv')" id="tab-vn-tv" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 border-b-[3px] border-transparent transition-all">
        📺 Sân khấu TV Tiếng Việt 16:9
      </button>
    </nav>

    <!-- External Link -->
    <div class="flex items-center gap-2">
      <a id="btn-fullscreen" href="/onthi-game-preview.html" target="_blank" class="px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 shadow-sm flex items-center gap-1.5 transition">
        <span>Mở toàn màn hình</span>
        <span>↗</span>
      </a>
      <a href="/" class="px-4 py-2 rounded-xl text-xs font-bold bg-violet-600 hover:bg-violet-700 text-white shadow-sm transition">
        Vào App Chính →
      </a>
    </div>
  </header>

  <!-- Main View Frame -->
  <main class="flex-1 p-4 flex flex-col">
    <div class="flex-1 bg-white rounded-3xl border border-slate-200/80 shadow-md overflow-hidden flex flex-col">
      <iframe id="preview-frame" src="/onthi-game-preview.html" class="w-full flex-1 border-0"></iframe>
    </div>
  </main>

  <script>
    const tabs = {
      'game': { url: '/onthi-game-preview.html' },
      'home': { url: '/onthi-home-preview.html' },
      'math-tv': { url: '/stitch-preview.html' },
      'vn-tv': { url: '/stitch-designs/vietnamese-phonics-smartboard.html' }
    };

    function setTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active', 'bg-[#58CC02]', 'text-white', 'border-[#45A300]');
        b.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById('tab-' + name);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.classList.remove('text-slate-600');
      }
      const item = tabs[name];
      if (item) {
        document.getElementById('preview-frame').src = item.url;
        document.getElementById('btn-fullscreen').href = item.url;
      }
    }
  </script>
</body>
</html>
