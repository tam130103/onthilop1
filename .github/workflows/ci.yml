name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Validate, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Lesson Content & Audio Integrity
        run: npm run validate

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build PWA Production Bundle
        run: npm run build
