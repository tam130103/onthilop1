<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58CC02" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Ôn Thi – Học Toán, Tiếng Việt Lớp 1 như chơi game</title>
    <!-- Google Fonts: Nunito (chuẩn hiển thị tiếng Việt mượt mà không lỗi dấu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; }
      body {
        font-family: 'Nunito', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
        background: #F7F7FD;
        color: #1E293B;
        -webkit-font-smoothing: antialiased;
      }
      /* Duolingo / Onthi 3D tactile button utilities */
      .btn-3d {
        transition: all 0.08s ease-in-out;
        user-select: none;
      }
      .btn-3d:active {
        transform: translateY(3px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
